# Проверки BlueGem на каждый пуш и пулл-реквест:
#   * server — встроенный сервер на Rust: его собственные тесты (cargo test)
#     и проверки API по HTTP (server/api_tests, pytest), включая открытие
#     базы, созданной BlueGem 1.5.0;
#   * frontend — Jest: слияние для синхронизации, поиск, обратные ссылки,
#     правила резервных копий и хранилище телефона (IndexedDB);
#   * e2e — Playwright в настоящем браузере: собранный интерфейс, настоящий
#     сервер, в том числе синхронизация между двумя «компьютерами».
name: Tests

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Встроенный сервер — Rust (server/); rustup на раннерах уже есть.
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --release --locked
        working-directory: server
      - run: cargo build --release --locked
        working-directory: server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/api_tests/requirements.txt
      - run: pip install -r server/api_tests/requirements.txt
      - run: python -m pytest -q server/api_tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
        working-directory: frontend
      - run: yarn test --watchAll=false
        working-directory: frontend
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      # Встроенный сервер — Rust (server/); rustup на раннерах уже есть.
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release --locked
        working-directory: server

      - name: Build the interface
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn build
        working-directory: frontend
        env:
          # Предупреждения линтера не должны валить сборку для тестов.
          CI: false

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
        working-directory: e2e

      - run: npx playwright test
        working-directory: e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
