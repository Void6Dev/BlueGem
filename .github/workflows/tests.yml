# Проверки BlueGem на каждый пуш и пулл-реквест:
#   * backend — pytest по API встроенного сервера (backend/tests);
#   * frontend — Jest: слияние для синхронизации, поиск, обратные ссылки,
#     правила резервных копий и хранилище телефона (IndexedDB);
#   * e2e — Playwright в настоящем браузере: собранный интерфейс, настоящий
#     сервер, в том числе синхронизация между двумя «компьютерами».
name: Tests

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
        working-directory: frontend
      - run: yarn test --watchAll=false
        working-directory: frontend
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt

      - name: Build the interface
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn build
        working-directory: frontend
        env:
          # Предупреждения линтера не должны валить сборку для тестов.
          CI: false

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
        working-directory: e2e

      - run: npx playwright test
        working-directory: e2e
        env:
          CI: true
          BG_PYTHON: python

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
