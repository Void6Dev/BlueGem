# Выпуск версии: тег 1.5.0 / v1.5.0 → релиз с файлами для Windows и Linux.
#
#   1. draft   — заводит релиз черновиком (текст — из .github/release-notes/
#                <версия>.md, если он есть). Черновик десктопная версия не видит
#                (electron/update.js), поэтому пока файлы собираются, никто не
#                получит обновление без своего файла.
#   2. windows — установщик и портативный exe (сервер замораживается на Windows);
#      linux   — AppImage и .deb (на Linux). Идут параллельно.
#   3. publish — снимает черновик, когда приложены все четыре файла.
#
# Перезапуск прогона безопасен: файлы заменяются (--clobber), а уже
# опубликованный релиз черновиком обратно не становится.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег версии, например 1.5.0"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже есть — только обновляю файлы."
            exit 0
          fi
          NOTES=".github/release-notes/${TAG#v}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --draft --title "BlueGem ${TAG#v}" --notes-file "$NOTES"
          else
            gh release create "$TAG" --draft --title "BlueGem ${TAG#v}" --generate-notes
          fi

  windows:
    needs: draft
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend environment
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          cd frontend && yarn install --frozen-lockfile --ignore-engines --network-timeout 600000
      - name: Build
        run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BlueGem-windows
          path: release/*.exe
          if-no-files-found: error
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/*.exe --clobber

  linux:
    needs: draft
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          cd frontend && yarn install --frozen-lockfile --ignore-engines
      - name: Build
        run: npm run dist:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BlueGem-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/*.AppImage release/*.deb --clobber

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
