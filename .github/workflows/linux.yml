# Linux-сборка BlueGem: AppImage и .deb — проверка на каждый пуш, который
# трогает десктопную часть, и запуск вручную (Actions → Linux → Run workflow).
# Файлы — в артефактах прогона.
#
# Выпуск версии с файлами в релизе делает release.yml (тег 1.5.0 / v1.5.0).
#
# Собирается на Linux потому, что встроенный сервер замораживает PyInstaller,
# а он собирает только под ту систему, на которой запущен.
name: Linux

on:
  push:
    branches: ["**"]
    paths:
      - "electron/**"
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "scripts/build.mjs"
      - "scripts/build-backend.mjs"
      - "electron-builder.yml"
      - "package.json"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/yarn.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Сервер: то же окружение backend/.venv, что и при сборке на Windows.
      - name: Backend environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && yarn install --frozen-lockfile --ignore-engines

      # AppImage и deb; в релиз их кладёт release.yml, не electron-builder.
      - name: Build
        run: npm run dist:linux -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: BlueGem-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
