# Linux-сборка BlueGem: AppImage и .deb — проверка на каждый пуш, который
# трогает десктопную часть, и запуск вручную (Actions → Linux → Run workflow).
# Файлы — в артефактах прогона.
#
# Выпуск версии с файлами в релизе делает release.yml (тег 1.5.0 / v1.5.0).
#
# Собирается на Linux потому, что встроенный сервер (server/, Rust)
# компилируется под ту систему, на которой идёт сборка.
name: Linux

on:
  push:
    branches: ["**"]
    paths:
      - "electron/**"
      - "server/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "scripts/build.mjs"
      - "scripts/build-backend.mjs"
      - "electron-builder.yml"
      - "package.json"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/yarn.lock

      # Встроенный сервер — Rust (server/); rustup на раннерах уже есть.
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && yarn install --frozen-lockfile --ignore-engines

      # AppImage и deb; в релиз их кладёт release.yml, не electron-builder.
      - name: Build
        run: npm run dist:linux -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: BlueGem-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
