<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
    <title>BlueGem</title>
    <style>
      /* Заставка на те секунды, пока поднимается встроенный сервер.
         Цвета — те же переменные, что и в приложении, чтобы переход не резал глаз. */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0a0f;
        color: #e7e7e9;
        font: 400 14px/1.5 "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Камень в двух кольцах: внешнее медленно вращается световой дугой,
         внутреннее пульсирует. По камню изредка пробегает блик — тот же,
         что у логотипа на главной. */
      .stage {
        position: relative;
        width: 168px;
        height: 168px;
        display: grid;
        place-items: center;
        animation: enter 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0deg, rgba(57, 190, 230, 0.0) 200deg,
          rgba(57, 190, 230, 0.9) 320deg, transparent 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        animation: spin 2.4s linear infinite;
      }
      .ring.slow {
        inset: 14px;
        background: conic-gradient(from 180deg, transparent 0deg, rgba(154, 99, 232, 0.0) 220deg,
          rgba(154, 99, 232, 0.75) 330deg, transparent 360deg);
        animation-duration: 3.6s;
        animation-direction: reverse;
      }
      .halo {
        position: absolute;
        inset: 30px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(57, 190, 230, 0.35), transparent);
        animation: halo 2.4s ease-in-out infinite;
      }
      .gem {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 24px;
        overflow: hidden;
        filter: drop-shadow(0 18px 45px rgba(56, 132, 255, 0.35));
        animation: float 3.2s ease-in-out infinite;
      }
      .gem img { width: 100%; height: 100%; display: block; }
      .gem::after {
        content: "";
        position: absolute;
        inset: -30%;
        background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.6) 50%, transparent 60%);
        transform: translateX(-130%);
        animation: glint 3.2s cubic-bezier(0.22, 1, 0.36, 1) 0.6s infinite;
      }
      .title {
        font-size: 20px;
        letter-spacing: 0.01em;
        animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
      }
      .hint {
        font-size: 12.5px;
        color: #8b8b93;
        animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
      }
      .bar {
        position: relative;
        width: 190px;
        height: 2px;
        border-radius: 2px;
        background: #1c1c22;
        overflow: hidden;
        animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
      }
      .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 45%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #39bee6 40%, #9a63e8 80%, transparent);
        box-shadow: 0 0 12px rgba(57, 190, 230, 0.8);
        animation: slide 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes enter {
        from { opacity: 0; transform: scale(0.86); filter: blur(6px); }
        to { opacity: 1; transform: none; filter: none; }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes halo { 0%, 100% { opacity: 0.55; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes glint { 0% { transform: translateX(-130%); } 35%, 100% { transform: translateX(130%); } }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(240%); } }
      @media (prefers-reduced-motion: reduce) {
        .stage, .ring, .halo, .gem, .gem::after, .title, .hint, .bar, .bar i { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <span class="halo"></span>
      <span class="ring"></span>
      <span class="ring slow"></span>
      <div class="gem"><img src="app-icon.png" alt="" /></div>
    </div>
    <div class="title">BlueGem</div>
    <div class="bar"><i></i></div>
    <!-- Подпись подставляет main.js: заставка открывается раньше интерфейса,
         и язык на этот момент знает только оболочка. -->
    <div class="hint" id="hint">Starting the local server…</div>
    <script>
      const hint = new URLSearchParams(location.search).get("hint");
      if (hint) document.getElementById("hint").textContent = hint;
    </script>
  </body>
</html>
