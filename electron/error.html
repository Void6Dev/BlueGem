<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>BlueGem</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 28px;
        background: #0a0a0f;
        color: #e7e7e9;
        font: 400 14px/1.6 "Segoe UI", system-ui, sans-serif;
      }
      .card { width: 100%; max-width: 660px; }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
      p.lead { margin: 0 0 20px; color: #a1a1aa; }
      pre {
        margin: 0 0 18px;
        padding: 14px 16px;
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        background: #121214;
        border: 1px solid #232326;
        border-radius: 10px;
        color: #b9b9c0;
        font: 400 12px/1.55 "Cascadia Mono", "Consolas", monospace;
      }
      .path { color: #6f6f78; font-size: 12px; margin: 0 0 22px; word-break: break-all; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      button {
        appearance: none;
        border: 1px solid #2a2a2e;
        background: #17171a;
        color: #e7e7e9;
        border-radius: 999px;
        padding: 9px 18px;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary { background: #1e6fd9; border-color: #1e6fd9; color: #fff; }
      button:hover { filter: brightness(1.12); }
      .badge {
        display: inline-block;
        margin-bottom: 14px;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(225, 29, 72, 0.14);
        color: #fb7185;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge" id="badge"></span>
      <h1 id="message"></h1>
      <p class="lead" id="lead"></p>
      <pre id="details">—</pre>
      <p class="path" id="logline"></p>
      <div class="row">
        <button class="primary" id="retry"></button>
        <button id="openLog"></button>
        <button id="copy"></button>
      </div>
    </div>

    <script>
      // Своего словаря у страницы нет: подписи и подробности приходят
      // в query-строке от основного процесса, который знает язык.
      const TEXTS = {
        en: {
          badge: "Startup error",
          title: "BlueGem could not start",
          lead: "Your projects are unharmed — they live in the local database. "
            + "Below is what the program reported.",
          noDetails: "No further details.",
          log: "Full log: ",
          restart: "Restart",
          showLog: "Show log",
          copy: "Copy the error text",
          copied: "Copied",
        },
        ru: {
          badge: "Ошибка запуска",
          title: "Не удалось запустить BlueGem",
          lead: "Данные проектов не пострадали — они лежат в локальной базе. "
            + "Ниже то, что сообщила программа.",
          noDetails: "Дополнительных сведений нет.",
          log: "Полный лог: ",
          restart: "Перезапустить",
          showLog: "Показать лог",
          copy: "Скопировать текст ошибки",
          copied: "Скопировано",
        },
      };

      const params = new URLSearchParams(location.search);
      const s = TEXTS[params.get("lang")] || TEXTS.en;
      const message = params.get("message") || s.title;
      const details = params.get("details") || s.noDetails;
      const logFile = params.get("log") || "";

      document.title = `BlueGem — ${s.badge}`;
      document.documentElement.lang = params.get("lang") || "en";
      document.getElementById("badge").textContent = s.badge;
      document.getElementById("message").textContent = message;
      document.getElementById("lead").textContent = s.lead;
      document.getElementById("details").textContent = details;
      document.getElementById("logline").textContent = logFile ? s.log + logFile : "";
      document.getElementById("retry").textContent = s.restart;
      document.getElementById("openLog").textContent = s.showLog;
      document.getElementById("copy").textContent = s.copy;

      const bridge = window.bluegem || {};
      document.getElementById("retry").onclick = () => bridge.restart?.();
      document.getElementById("openLog").onclick = () => bridge.openLog?.();
      document.getElementById("copy").onclick = async (e) => {
        await navigator.clipboard.writeText(`${message}\n\n${details}`);
        e.target.textContent = s.copied;
      };
      if (!logFile) document.getElementById("openLog").style.display = "none";
    </script>
  </body>
</html>
