appId: com.bluegem.app
productName: BlueGem
copyright: BlueGem

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: frontend/build
    to: app-ui
    filter: ["**/*", "!**/*.map"]
  - from: backend/dist/bluegem-backend
    to: backend

npmRebuild: false

win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

fileAssociations:
  - ext: bgproj
    name: BlueGem Project
    description: Проект BlueGem
    icon: build/file-icon.ico
    role: Editor
  - ext: swproj
    name: BlueGem Project (старое расширение)
    description: Проект BlueGem
    icon: build/file-icon.ico
    role: Editor

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BlueGem
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.exe
  unpackDirName: BlueGem
